[project]
name = "hcl-mcp"
version = "0.1.0"
description = "Spectral / human-centric-lighting toolkit (derived from Lark Spectral Lighting) as an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["fastmcp>=4.2,<5", "fastmcp-tasks>=4.2,<5", "pydantic>=2", "colour-science>=0.4.4",
                "matplotlib>=3.7"]

[project.scripts]
hcl-mcp = "hcl_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcl_core", "src/hcl_mcp", "src/hcl_radiance", "src/hcl_daysim", "src/hcl_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
